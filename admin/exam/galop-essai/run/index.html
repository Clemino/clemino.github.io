ire se fonde-t-il ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"La tranquillité\"},{\"id\":\"b\",\"label\":\"La dignité\"},{\"id\":\"c\",\"label\":\"La salubrité\"}]}},{\"id\":\"q2\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Quel arrêt fonde le contrôle de la mesure ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Labonne\"},{\"id\":\"b\",\"label\":\"Benjamin\"},{\"id\":\"c\",\"label\":\"Blanco\"}]}},{\"id\":\"q3\",\"type\":\"TRUE_FALSE\",\"prompt\":\"Une interdiction générale et absolue est en principe légale.\",\"payload\":{}},{\"id\":\"q4\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Quelle est la conclusion ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"L'arrêté est légal\"},{\"id\":\"b\",\"label\":\"L'arrêté est disproportionné et illégal\"},{\"id\":\"c\",\"label\":\"Le juge est incompétent\"}]}}]},\"solution\":{\"subSolutions\":[{\"id\":\"q1\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q2\",\"solution\":{\"correct\":[\"b\"]}},{\"id\":\"q3\",\"solution\":{\"value\":false}},{\"id\":\"q4\",\"solution\":{\"correct\":[\"b\"]}}]},\"explanation\":\"Le maire est compétent, mais une interdiction générale et absolue, sans limite de temps et de lieu, est disproportionnée (Benjamin, Daudignac).\",\"concepts\":[\"autorites-police\",\"proportionnalite\"],\"source\":\"Fascicule de TD, séance 5 (d'après le cas pratique du galop 2025)\"}]}]}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:I[40082,[\"/admin/_next/static/chunks/8085d7f888ca6ca2.js\",\"/admin/_next/static/chunks/a69d90497ac53907.js\"],\"IconMark\"]\nc:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"admin.app — Réviser le droit administratif\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Plateforme de révision du droit administratif (L2) : service public, police, sources de la légalité,
