"type\":\"MCQ_SINGLE\",\"prompt\":\"Le juge peut-il confronter la loi à la convention ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Oui, depuis Nicolo\"},{\"id\":\"b\",\"label\":\"Non, la loi fait aussi écran au traité\"}]}},{\"id\":\"q4\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Si la loi est incompatible avec la convention, que fait le juge ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Il écarte la loi, et annule le décret\"},{\"id\":\"b\",\"label\":\"Il annule la loi\"}]}}]},\"solution\":{\"subSolutions\":[{\"id\":\"q1\",\"solution\":{\"correct\":[\"b\"]}},{\"id\":\"q2\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q3\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q4\",\"solution\":{\"correct\":[\"a\"]}}]},\"explanation\":\"Le décret reproduit la loi : elle fait écran (Arrighi). La QPC ouvre la voie constitutionnelle, et le moyen d'inconventionnalité contourne l'écran (Nicolo). Le juge écarte la loi sans l'annuler, et le décret perd sa base légale.\",\"concepts\":[\"loi-ecran\",\"conditions-article-55\"],\"source\":\"Fascicule de TD, séance 7 (d'après le cas pratique du partiel de janvier 2024)\"},{\"id\":\"141dcfdd32ac\",\"moduleSlug\":\"m11-controle-legalite\",\"chapterSlug\":\"td-seance-10\",\"type\":\"CASE_STUDY\",\"difficulty\":3,\"points\":4,\"prompt\":\"Cas guidé : le refus de terrasse.\",\"payload\":{\"scenario\":\"Le 3 mars, un maire notifie à un commerçant le refus de renouveler son autorisation de terrasse, avec les voies et délais de recours. Le 20 avril, le commerçant forme un recours gracieux, rejeté le 15 mai. Il veut saisir le juge pour obtenir l'annulation du refus, en soutenant que l'adjoint signataire n'avait pas de délégation et que le maire a voulu favoriser un concurrent.\",\"subQuestions\":[{\"id\":\"q1\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Quel recours exercer ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Le recours pour excès de pouvoir devant le tribunal administratif\"},{\"id\":\"b\",\"label\":\"Le recours d
