<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Clément Otero</title>
		<style>
			:root {
				--bg: #1d6b58;
				--text: #f4f4f1;
				--soft: #cfe3dc;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0f3d33;
					--soft: #b8d4cb;
				}
			}
			body {
				display: flex;
				flex-direction: column-reverse;
				justify-content: space-between;
				gap: 3rem;
				min-height: 100svh;
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			}
			h1 {
				margin: 0;
			}
			svg {
				display: block;
				width: 100%;
				height: auto;
				overflow: visible;
			}
			text {
				fill: currentColor;
				font-size: 245px;
				font-weight: 800;
			}
			nav {
				padding: clamp(1.25rem, 4vw, 3rem);
			}
			ul {
				display: grid;
				gap: 1.5rem;
				max-width: 34rem;
				margin: 0;
				padding: 0;
				list-style: none;
			}
			a {
				display: block;
				color: inherit;
				text-decoration: none;
			}
			a:focus-visible {
				outline: 3px solid var(--text);
				outline-offset: 4px;
			}
			strong {
				display: block;
				font-size: clamp(1.5rem, 4vw, 2.5rem);
				line-height: 1.15;
			}
			a:hover strong {
				text-decoration: underline;
				text-decoration-thickness: 0.08em;
				text-underline-offset: 0.12em;
			}
			span {
				display: block;
				margin-top: 0.25rem;
				color: var(--soft);
				line-height: 1.4;
			}
		</style>
	</head>
	<body>
		<h1>
			<!-- textLength keeps the name edge to edge whatever font the visitor's system provides. -->
			<svg viewBox="0 0 1000 200" role="img" aria-label="Clément">
				<text y="197" textLength="1000" lengthAdjust="spacingAndGlyphs">Clément</text>
			</svg>
		</h1>
		<nav aria-label="Applications">
			<ul>
				<li>
					<a href="clip/">
						<strong>Presse-papier</strong>
						<span>Envoyer du texte du PC au téléphone, chiffré de bout en bout.</span>
					</a>
				</li>
				<li>
					<a href="trd/">
						<strong>Trading</strong>
						<span>Apprendre le trading, du niveau zéro au bot.</span>
					</a>
				</li>
				<li>
					<a href="admin/">
						<strong>Droit administratif</strong>
						<span>Réviser le cours de L2, avec des exercices et des cas pratiques.</span>
					</a>
				</li>
			</ul>
		</nav>
	</body>
</html>
