\"source\":\"CM, I, A (p. 3-4)\"},{\"id\":\"5331ca2bb4f4\",\"moduleSlug\":\"m1-critique-ambivalente\",\"chapterSlug\":\"abstention-populisme\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Pourquoi Rosanvallon dit-il que « populisme » a d'abord été un terme stigmate ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Il sert à mettre l'adversaire hors du jeu de la rationalité démocratique\"},{\"id\":\"b\",\"label\":\"Il ne désigne que les partis d'extrême droite\"},{\"id\":\"c\",\"label\":\"Il a d'abord été employé en Russie\"},{\"id\":\"d\",\"label\":\"Personne ne l'a jamais revendiqué\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"Il suffit de traiter quelqu'un de populiste pour l'écarter sans examen, comme avec le mot « complotiste ». Le terme est pourtant revendiqué, à droite comme à gauche.\",\"hint\":\"Rosanvallon le rapproche du mot « complotiste ».\",\"concepts\":[\"populisme\"],\"source\":\"CM, I, B (p. 6)\"},{\"id\":\"872ad1c43a99\",\"moduleSlug\":\"m5-repolitisation\",\"chapterSlug\":\"representation-theories\",\"type\":\"TRUE_FALSE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Pour Sieyès, si la démocratie remplace la monarchie, elle ne peut être que représentative.\",\"payload\":{},\"solution\":{\"value\":true},\"explanation\":\"Sieyès écrit contre la démocratie directe : la nation ne peut pas s'assembler (argument technique), et ce n'est pas nécessaire, puisque les représentants veulent ce que voudrait la nation (argument substantiel).\",\"hint\":\"Repense aux deux arguments de Sieyès.\",\"concepts\":[\"argument-technique\",\"argument-substantiel\"],\"source\":\"CM, V, A (p. 38)\"},{\"id\":\"96496f959d20\",\"moduleSlug\":\"m2-pouvoir-demos\",\"chapterSlug\":\"population-peuple\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Que confond, selon Aron, la formule « gouvernement du peuple, par le peuple et pour le peuple » ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Le pouvoir législatif et le pouvoir exécutif\"},{\"id\":\"b\",\"label\":\"La nation et la race\"},{\"id\":\"c\",\"label\":\"Le détenteur du pouvoir légitime et le possesseur de l'autorité de fait\"},{\"id\":\"d\",\"label\":\"Le peuple et la multitude\"}]},\"solution\":{\"correct\":[\"c\"]},\"explanation\":\"Le peuple est le détenteur légitime du pouvoir, mais ce sont des représentants, une oligarchie désignée par des procédures, qui l'exercent.\",\"hint\":\"Aron constate que le peuple ne dirige pas dans les régimes de l'Ouest.\",\"concepts\":[\"regime-constitutionnel-pluraliste\",\"formule-lincoln\"],\"source\":\"CM, II, A (p. 12-14)\"},{\"id\":\"0d1d723904e6\",\"moduleSlug\":\"m2-pouvoir-demos\",\"chapterSlug\":\"construction-peuple\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Pourquoi le cours cite-t-il la Suisse contre la définition du peuple par la langue ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Elle n'a aucune langue officielle\"},{\"id\":\"b\",\"label\":\"Elle a été absorbée par la Grande Allemagne\"},{\"id\":\"c\",\"label\":\"Elle a des frontières naturelles\"},{\"id\":\"d\",\"label\":\"Elle a quatre langues officielles et un fort sentiment patriotique\"}]},\"solution\":{\"correct\":[\"d\"]},\"explanation\":\"Français, italien, allemand, romanche : la Suisse forme pourtant une nation au patriotisme très fort. Ce sont les États-Unis qui n'ont aucune langue officielle.\",\"hint\":\"Le cours cite deux contre-exemples : la Suisse et les États-Unis.\",\"concepts\":[\"etat-ordre-juridique\"],\"source\":\"CM, II, B (p. 15-16)\"},{\"id\":\"66e05876b375\",\"moduleSlug\":\"m2-pouvoir-demos\",\"chapterSlug\":\"auto-institution\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Chez Rousseau, que devient le roi ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Un mandataire provisoire, élu pour réaliser la volonté du peuple\"},{\"id\":\"b\",\"label\":\"Le seul détenteur de la souveraineté\"},{\"id\":\"c\",\"label\":\"Le représentant de Dieu sur terre\"},{\"id\":\"d\",\"label\":\"L'auteur des lois\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"La volonté du peuple est l'origine de tout droit : le roi n'est qu'un représentant provisoire chargé de l'exécuter. Les lois reviennent au peuple.\",\"hint\":\"Chez Rousseau, la souveraineté reste au peuple.\",\"concepts\":[\"legislatif-executif\",\"volonte-generale\"],\"source\":\"CM, II, C (p. 17-18)\"},{\"id\":\"ca1344618506\",\"moduleSlug\":\"m3-critiques-principe\",\"chapterSlug\":\"mauvaise-egalite\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Dans le Gorgias, que représente le médecin ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"La flatterie des sens\"},{\"id\":\"b\",\"label\":\"Un art véritable, qui vise le bien même par des moyens désagréables\"},{\"id\":\"c\",\"label\":\"La rhétorique des sophistes\"},{\"id\":\"d\",\"label\":\"La démagogie\"}]},\"solution\":{\"correct\":[\"b\"]},\"explanation\":\"Le médecin vise la santé durable, quitte à imposer un régime strict ou un remède amer ; le cuisinier flatte le goût, comme le démagogue flatte le peuple.\",\"hint\":\"Le médecin s'oppose au cuisinier.\",\"concepts\":[\"demagogie\"],\"source\":\"CM, III, A (p. 25-26)\"},{\"id\":\"3f2d9df06313\",\"moduleSlug\":\"m5-repolitisation\",\"chapterSlug\":\"critiques-representation\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Selon Bernard Manin, qu'est-ce qui a empêché la démocratie des partis de s'approfondir ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"L'entrée des femmes dans la vie politique\"},{\"id\":\"b\",\"label\":\"Le poids de l'argent dans la vie politique\"},{\"id\":\"c\",\"label\":\"Le compromis entre partis\"},{\"id\":\"d\",\"label\":\"L'abolition du cens\"}]},\"solution\":{\"correct\":[\"b\"]},\"explanation\":\"Les campagnes coûtent de plus en plus cher, ceux qui ont de l'argent veulent peser, et les partis deviennent des machines autonomes de leurs militants. L'entrée des femmes et l'abolition du cens ont au contraire élargi la démocratie.\",\"hint\":\"Manin oppose ce qui a élargi la démocratie à ce qui l'a freinée.\",\"concepts\":[\"partis-masse\"],\"source\":\"CM, V, B (p. 41)\"},{\"id\":\"98a9962a4569\",\"moduleSlug\":\"m3-critiques-principe\",\"chapterSlug\":\"theories-dictature\",\"type\":\"TRUE_FALSE\",\"difficulty\":2,\"points\":1,\"prompt\":\"La dictature romaine pouvait durer indéfiniment, tant que la crise n'était pas résolue.\",\"payload\":{},\"solution\":{\"value\":false},\"explanation\":\"Elle durait six mois au plus ; le pouvoir, librement concentré face à la crise, était ensuite rendu.\",\"hint\":\"Pense à ce qui distingue la dictature romaine des dictatures « normales » des doctrines radicales.\",\"concepts\":[\"dictature-romaine\"],\"source\":\"CM, III, C (p. 29-30)\"},{\"id\":\"02eb0f68805a\",\"moduleSlug\":\"m4-deliberation\",\"chapterSlug\":\"resistance-abus\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Pourquoi la révolution a-t-elle longtemps été condamnée, selon le cours ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Elle fait passer de l'état de paix à l'état de guerre, le pire des maux\"},{\"id\":\"b\",\"label\":\"Elle donne trop de pouvoir au monarque\"},{\"id\":\"c\",\"label\":\"Elle supprime toujours le Parlement\"},{\"id\":\"d\",\"label\":\"Elle est toujours menée par une élite\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"On pensait qu'un ordre injuste valait mieux que l'absence d'ordre. Locke répond que la révolution peut être une guerre défensive contre un monarque devenu ennemi du peuple.\",\"hint\":\"Le cours compare l'ordre injuste et l'absence d'ordre.\",\"concepts\":[\"revolution-defensive\"],\"source\":\"CM, IV, A (p. 32-33)\"},{\"id\":\"854f1d0219ce\",\"moduleSlug\":\"m4-deliberation\",\"chapterSlug\":\"resistance-abus\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Quel est, selon le cours, le quatrième contre-pouvoir ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Le peuple en armes\"},{\"id\":\"b\",\"label\":\"Le juge constitutionnel\"},{\"id\":\"c\",\"label\":\"La presse libre\"},{\"id\":\"d\",\"label\":\"Les syndicats\"}]},\"solution\":{\"correct\":[\"c\"]},\"explanation\":\"La presse libre, qui critique le pouvoir, est considérée comme un quatrième contre-pouvoir.\",\"hint\":\"Le cours le cite à propos de Montesquieu et du modèle anglais.\",\"concepts\":[\"pouvoir-arrete-pouvoir\"],\"source\":\"CM, IV, A (p. 34-35)\"},{\"id\":\"b9a30bf02efa\",\"moduleSlug\":\"m4-deliberation\",\"chapterSlug\":\"moindre-mal\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Selon Aron, qu'est-ce qui caractérise un régime constitutionnel pluraliste ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Un nombre de partis fixé d'avance\"},{\"id\":\"b\",\"label\":\"Un parti unique qui exprime la vraie volonté du peuple\"},{\"id\":\"c\",\"label\":\"Le gouvernement direct du peuple\"},{\"id\":\"d\",\"label\":\"Une pluralité indéfinie de partis en concurrence réglée pour le pouvoir\"}]},\"solution\":{\"correct\":[\"d\"]},\"explanation\":\"Le nombre de partis n'est pas fixé d'avance ; à certaines conditions, n'importe qui peut tenter sa chance, et l'élection remet le pouvoir en jeu.\",\"hint\":\"Pense à Napoléon III, qui n'autorisait que certains partis.\",\"concepts\":[\"regime-constitutionnel-pluraliste\"],\"source\":\"CM, IV, B (p. 34-36)\"},{\"id\":\"95b638767e92\",\"moduleSlug\":\"m3-critiques-principe\",\"chapterSlug\":\"theories-dictature\",\"type\":\"CASE_STUDY\",\"difficulty\":3,\"points\":4,\"prompt\":\"Cas guidé : trois critiques de la démocratie.\",\"payload\":{\"scenario\":\"Lors d'un débat, trois intervenants s'affrontent.\\n\\nA : « Le peuple vote mal. Confions le pouvoir à ceux qui ont étudié la science politique. »\\n\\nB : « Les hommes sont inégaux par nature. L'État doit être géré comme une entreprise, par ceux qui possèdent. »\\n\\nC : « En cas de crise, il faut un chef qui décide seul, sans s'embarrasser de l'État de droit, qui est un État faible. »\",\"subQuestions\":[{\"id\":\"q1\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"De quel auteur l'intervenant A est-il le plus proche ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Tocqueville\"},{\"id\":\"b\",\"label\":\"Platon\"},{\"id\":\"c\",\"label\":\"Burke\"}]}},{\"id\":\"q2\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"De quels auteurs l'intervenant B est-il le plus proche ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Nick Land et Curtis Yarvin\"},{\"id\":\"b\",\"label\":\"Marx et les marxistes\"},{\"id\":\"c\",\"label\":\"Locke et Kant\"}]}},{\"id\":\"q3\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"De quel auteur l'intervenant C est-il le plus proche ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Montesquieu\"},{\"id\":\"b\",\"label\":\"Alain\"},{\"id\":\"c\",\"label\":\"Carl Schmitt\"}]}},{\"id\":\"q4\",\"type\":\"TRUE_FALSE\",\"prompt\":\"La proposition de A repose sur l'égalité arithmétique : une voix vaut une voix.\",\"payload\":{}}]},\"solution\":{\"subSolutions\":[{\"id\":\"q1\",\"solution\":{\"correct\":[\"b\"]}},{\"id\":\"q2\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q3\",\"solution\":{\"correct\":[\"c\"]}},{\"id\":\"q4\",\"solution\":{\"value\":false}}]},\"explanation\":\"A : l'épistémocratie de Platon. B : l'inégalité naturelle de Nick Land et l'État-entreprise de Yarvin. C : Carl Schmitt, qui juge l'État de droit faible et admire le décisionnisme. Q4 : A rejette l'égalité arithmétique au profit de l'égalité géométrique, selon la compétence.\",\"hint\":\"Chaque intervenant reprend une famille de critiques de la partie III.\",\"concepts\":[\"epistemocratie\",\"egalite-geometrique\",\"etat-entreprise\",\"decisionnisme\"],\"source\":\"CM, III (p. 22-30)\"},{\"id\":\"81cb23212e14\",\"moduleSlug\":\"m4-deliberation\",\"chapterSlug\":\"moindre-mal\",\"type\":\"CASE_STUDY\",\"difficulty\":3,\"points\":4,\"prompt\":\"Cas guidé : un gouvernement pressé.\",\"payload\":{\"scenario\":\"Un gouvernement imaginaire propose trois mesures.\\n\\n1. Repousser d'un an les élections, « pour ne pas troubler la reprise économique ».\\n\\n2. Confier la politique de la ville à des experts, « parce que gouverner est un métier », les citoyens n'ayant plus qu'à approuver les objectifs fixés par ces experts.\\n\\n3. Supprimer la commission chargée de contrôler le gouvernement, « car elle ralentit tout ».\",\"subQuestions\":[{\"id\":\"q1\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Quelle règle de la concurrence pluraliste la mesure 1 enfreint-elle ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Le respect du calendrier des élections\"},{\"id\":\"b\",\"label\":\"Le droit à un procès équitable\"},{\"id\":\"c\",\"label\":\"Le consentement du peuple à l'impôt\"}]}},{\"id\":\"q2\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Que répondrait Alain à la mesure 2 ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"C'est juste : le capitaine doit choisir la destination\"},{\"id\":\"b\",\"label\":\"Les experts peuvent choisir les moyens, mais c'est au peuple, armateur de la cité, de fixer les fins\"},{\"id\":\"c\",\"label\":\"Il faut plutôt tirer les experts au sort, comme à Athènes\"}]}},{\"id\":\"q3\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Quelle formule condamne le mieux la mesure 3 ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"« Il faut que, par la disposition des choses, le pouvoir arrête le pouvoir »\"},{\"id\":\"b\",\"label\":\"« Un droit inviolable et sacré »\"},{\"id\":\"c\",\"label\":\"« Le gouvernement du peuple, par le peuple et pour le peuple »\"}]}},{\"id\":\"q4\",\"type\":\"TRUE_FALSE\",\"prompt\":\"Pour Aristote, si des experts connaissent la bonne réponse, il devient inutile de délibérer sur les fins de la cité.\",\"payload\":{}}]},\"solution\":{\"subSolutions\":[{\"id\":\"q1\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q2\",\"solution\":{\"correct\":[\"b\"]}},{\"id\":\"q3\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q4\",\"solution\":{\"value\":false}}]},\"explanation\":\"Q1 : repousser les élections au-delà du calendrier, c'est, pour Aron, un coup d'État. Q2 : le capitaine juge des moyens, l'armateur des fins ; le propriétaire de la cité est le peuple. Q3 : Montesquieu veut que le pouvoir trouve des limites dans d'autres pouvoirs. Q4 : pour Aristote, la politique n'est pas une science : il n'y a pas de réponse unique, d'où la délibération.\",\"hint\":\"Mobilise Aron pour les règles, Alain pour le navire, Montesquieu pour les contre-pouvoirs.\",\"concepts\":[\"regles-concurrence\",\"capitaine-armateur\",\"pouvoir-arrete-pouvoir\",\"deliberation\"],\"source\":\"CM, IV (p. 29-36)\"}]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"15:I[68574,[\"/culture/_next/static/chunks/93d6b92b1100dd7f.js\",\"/culture/_next/static/chunks/2571da505c8daa2f.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"Culture générale — Crises et critiques des démocraties\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Plateforme de révision du cours de culture générale et grands débats contemporains, thème « Crises et critiques des démocraties » : populisme, définition du peuple, critiques de Platon à Carl Schmitt, délibération et démocratie libérale, démocratie représentative et civisme. Parcours linéaire verrouillé, exercices auto-corrigés et plans de dissertation.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/culture/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L15\",\"3\",{}]]\n"])</script></body></html>
