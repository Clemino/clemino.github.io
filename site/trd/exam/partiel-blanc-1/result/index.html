 1 — Fondations\",\"description\":\"Modules 1 à 3 : marchés, ordres et comptes, crypto-actifs. QCM 10 pts, calculs (frais, plus-values) 6 pts, cas pratique 4 pts.\",\"durationMinutes\":60,\"totalPoints\":20,\"questionCount\":14},\"exercises\":[{\"id\":\"ae8d4e298c7c\",\"moduleSlug\":\"m1-marches-financiers\",\"chapterSlug\":\"role-de-la-bourse\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Une entreprise déjà cotée voit son cours doubler en un an. Combien d'argent cette hausse lui a-t-elle apporté directement ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Aucun : les échanges ont lieu entre investisseurs sur le marché secondaire\"},{\"id\":\"b\",\"label\":\"La différence de capitalisation boursière\"},{\"id\":\"c\",\"label\":\"La moitié de la hausse\"},{\"id\":\"d\",\"label\":\"Une commission sur chaque transaction\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"La hausse du cours enrichit les actionnaires, pas l'entreprise : elle ne reçoit de l'argent que lorsqu'elle émet de nouveaux titres (marché primaire).\",\"hint\":\"**Marché secondaire** : Marché où les investisseurs s'échangent des titres déjà émis ; l'émetteur ne reçoit rien.\",\"concepts\":[\"marche-secondaire\"],\"source\":null},{\"id\":\"f6fc27e5c2ea\",\"moduleSlug\":\"m1-marches-financiers\",\"chapterSlug\":\"actions-obligations\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Les taux de marché baissent nettement. Que devient le prix d'une obligation à taux fixe déjà émise ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Il baisse\"},{\"id\":\"b\",\"label\":\"Il devient nul\"},{\"id\":\"c\",\"label\":\"Il monte\"},{\"id\":\"d\",\"label\":\"Il reste égal au nominal\"}]},\"solution\":{\"correct\":[\"c\"]},\"explanation\":\"Prix et taux varient en sens inverse : une obligation qui verse un coupon supérieur aux nouveaux taux vaut plus cher.\",\"hint\":null,\"concepts\":[\"prix-taux-obligation\"],\"source\":null},{\"id\":\"d1cac1a059b5\",\"moduleSlug\":\"m1-marches-financiers\",\"chapterSlug\":\"indices-etf\",\"type\":\"TRUE_FALSE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Un ETF capitalisant verse chaque année les dividendes reçus à ses porteurs.\",\"payload\":{},\"solution\":{\"value\":false},\"explanation\":\"C'est le contraire : l'ETF capitalisant réinvestit les dividendes dans le fonds ; l'ETF distribuant les verse.\",\"hint\":\"**ETF capitalisant ou distribuant** : Un ETF capitalisant réinvestit les dividendes ; un ETF distribuant les verse.\",\"concepts\":[\"etf-capitalisant\"],\"source\":null},{\"id\":\"96814cd84874\",\"moduleSlug\":\"m1-marches-financiers\",\"chapterSlug\":\"acteurs-regulateurs\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Quel acteur est « acheteur de tous les vendeurs et vendeur de tous les acheteurs » ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"La chambre de compensation\"},{\"id\":\"b\",\"label\":\"Le courtier\"},{\"id\":\"c\",\"label\":\"L'AMF\"},{\"id\":\"d\",\"label\":\"Le dépositaire central\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"La chambre de compensation s'interpose entre les parties pour garantir la bonne fin des transactions.\",\"hint\":\"**Chambre de compensation** : Contrepartie centrale : acheteur de tous les vendeurs et vendeur de tous les acheteurs.\",\"concepts\":[\"chambre-de-compensation\"],\"source\":null},{\"id\":\"ad1b2868f56f\",\"moduleSlug\":\"m1-marches-financiers\",\"chapterSlug\":\"euronext-cotation\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Tu passes à 8 h 30 un ordre d'achat au marché sur une valeur du CAC 40. À quel prix sera-t-il exécuté ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Il est refusé avant 9 h\"},{\"id\":\"b\",\"label\":\"Au cours du fixing d'ouverture de 9 h\"},{\"id\":\"c\",\"label\":\"Au cours de clôture de la veille\"},{\"id\":\"d\",\"label\":\"Au premier prix affiché à 7 h 15\"}]},\"solution\":{\"correct\":[\"b\"]},\"explanation\":\"Pendant la préouverture, les ordres s'accumulent sans transaction. Un ordre au marché est exécuté au cours d'ouverture déterminé par le fixing de 9 h.\",\"hint\":\"**Ordre au marché** : Ordre sans limite de prix, prioritaire, exécuté immédiatement à n'importe quel prix.\",\"concepts\":[\"seance-de-bourse\",\"ordre-au-marche\"],\"source\":null},{\"id\":\"67e7bedc8757\",\"moduleSlug\":\"m2-passer-un-ordre\",\"chapterSlug\":\"types-ordres\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Tu veux limiter ta perte sur une position tout en gardant la maîtrise du prix de vente. Quel ordre choisis-tu ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Un ordre à seuil de déclenchement\"},{\"id\":\"b\",\"label\":\"Un ordre à plage de déclenchement\"},{\"id\":\"c\",\"label\":\"Un ordre au marché\"},{\"id\":\"d\",\"label\":\"Un ordre à la meilleure limite\"}]},\"solution\":{\"correct\":[\"b\"]},\"explanation\":\"L'ordre à plage de déclenchement fixe un seuil et une limite : une fois déclenché, il devient un ordre à cours limité. Contrepartie : il peut ne pas être exécuté en cas de gap.\",\"hint\":null,\"concepts\":[\"ordre-stop\"],\"source\":null},{\"id\":\"60db6e94e401\",\"moduleSlug\":\"m2-passer-un-ordre\",\"chapterSlug\":\"pea-cto\",\"type\":\"MCQ_MULTI\",\"difficulty\":2,\"points\":1,\"prompt\":\"Quelles opérations entraînent en principe la clôture d'un PEA ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Le décès du titulaire\"},{\"id\":\"b\",\"label\":\"Un versement qui dépasse le plafond\"},{\"id\":\"c\",\"label\":\"Un retrait avant 5 ans sans motif d'exception\"},{\"id\":\"d\",\"label\":\"Un retrait partiel après 8 ans\"}]},\"solution\":{\"correct\":[\"a\",\"b\",\"c\"]},\"explanation\":\"Retrait avant 5 ans (hors exceptions), dépassement du plafond et décès entraînent la clôture. Après 5 ans, un retrait partiel laisse le plan ouvert.\",\"hint\":\"**PEA** : Plan d'épargne en actions : actions européennes, plafond 150 000 €, avantage fiscal après 5 ans.\",\"concepts\":[\"pea\",\"pea-anciennete\"],\"source\":null},{\"id\":\"69e69c2be7dd\",\"moduleSlug\":\"m2-passer-un-ordre\",\"chapterSlug\":\"reperer-arnaques\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Un site propose un « robot de trading IA » rapportant 3 % par semaine, sans risque. Le premier réflexe est :\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Demander une capture des performances\"},{\"id\":\"b\",\"label\":\"Lire les avis des utilisateurs\"},{\"id\":\"c\",\"label\":\"Tester avec une petite somme\"},{\"id\":\"d\",\"label\":\"Vérifier sa présence sur une liste d'acteurs autorisés, puis s'abstenir\"}]},\"solution\":{\"correct\":[\"d\"]},\"explanation\":\"Un rendement élevé présenté comme sans risque est un signal d'arnaque. Tester avec une petite somme est exactement ce que cherchent les escrocs.\",\"hint\":\"**Arnaque financière** : Promesse de rendement élevé sans risque, pression, acteur non agréé : les signaux d'alerte.\",\"concepts\":[\"arnaque-financiere\"],\"source\":null},{\"id\":\"f0d4c2f56717\",\"moduleSlug\":\"m3-crypto-actifs\",\"chapterSlug\":\"mica-prestataires\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Que garantit l'agrément MiCA d'une plateforme de crypto-actifs ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Une garantie des avoirs jusqu'à 100 000 €\"},{\"id\":\"b\",\"label\":\"Le remboursement de toute perte de valeur\"},{\"id\":\"c\",\"label\":\"Le respect d'exigences de capital, de gouvernance et de protection des clients\"},{\"id\":\"d\",\"label\":\"La stabilité du prix des crypto-actifs proposés\"}]},\"solution\":{\"correct\":[\"c\"]},\"explanation\":\"MiCA encadre les prestataires ; il ne protège ni contre la baisse des prix, ni par un fonds de garantie.\",\"hint\":\"**MiCA** : Règlement européen sur les marchés de crypto-actifs : agrément des prestataires et protection des investisseurs.\",\"concepts\":[\"mica\",\"psca\"],\"source\":null},{\"id\":\"128622818e50\",\"moduleSlug\":\"m3-crypto-actifs\",\"chapterSlug\":\"fiscalite-crypto\",\"type\":\"TRUE_FALSE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Échanger du bitcoin contre un stablecoin en dollars déclenche l'imposition de la plus-value.\",\"payload\":{},\"solution\":{\"value\":false},\"explanation\":\"Un échange entre actifs numériques sans soulte bénéficie d'un sursis d'imposition ; seul le passage vers les euros ou un bien est imposable.\",\"hint\":\"**Échange crypto contre crypto** : Échange sans soulte entre crypto-actifs : sursis d'imposition, pas de plus-value à déclarer.\",\"concepts\":[\"echange-crypto-crypto\"],\"source\":null},{\"id\":\"015131d87577\",\"moduleSlug\":\"m2-passer-un-ordre\",\"chapterSlug\":\"frais-impact\",\"type\":\"NUMERIC\",\"difficulty\":3,\"points\":2,\"prompt\":\"Tu achètes 200 actions d'une grande société française à 30 € (courtage 0,2 %, TTF 0,4 %) et les revends à 31,50 € (courtage 0,2 %). Quel est ton gain net avant impôt ?\",\"payload\":{\"unit\":\"€\",\"hint\":\"Sans espace ni symbole ; décimale avec un point ou une virgule.\"},\"solution\":{\"value\":251.4,\"absTol\":0.01},\"explanation\":\"Achat : 6 000 € + 12 € de courtage + 24 € de TTF = 6 036 €. Vente : 6 300 € − 12,60 € = 6 287,40 €. Gain net : 6 287,40 − 6 036 = 251,40 €.\",\"hint\":\"**Frais de courtage** : Commission prélevée par le courtier sur chaque ordre exécuté.\",\"concepts\":[\"frais-courtage\",\"ttf\"],\"source\":null},{\"id\":\"9897fc555505\",\"moduleSlug\":\"m2-passer-un-ordre\",\"chapterSlug\":\"fiscalite-plus-values\",\"type\":\"NUMERIC\",\"difficulty\":3,\"points\":2,\"prompt\":\"Sur un CTO, tu achètes 80 actions à 45 € (frais 9 €) et les revends à 52 € (frais 10 €). Avec un PFU de 30 %, quel impôt paies-tu ?\",\"payload\":{\"unit\":\"€\",\"hint\":\"Sans espace ni symbole ; décimale avec un point ou une virgule.\"},\"solution\":{\"value\":162.3,\"absTol\":0.01},\"explanation\":\"Prix de vente net : 4 160 − 10 = 4 150 € ; prix d'achat frais compris : 3 600 + 9 = 3 609 €. Plus-value : 541 € ; impôt : 30 % × 541 = 162,30 €.\",\"hint\":\"**Prélèvement forfaitaire unique** : Flat tax : 12,8 % d'impôt sur le revenu plus les prélèvements sociaux sur les gains du CTO.\",\"concepts\":[\"pfu\"],\"source\":null},{\"id\":\"845031f68af1\",\"moduleSlug\":\"m3-crypto-actifs\",\"chapterSlug\":\"fiscalite-crypto\",\"type\":\"NUMERIC\",\"difficulty\":3,\"points\":2,\"prompt\":\"Tu as acquis pour 5 000 € de crypto-actifs. Ton portefeuille vaut 8 000 € et tu vends pour 2 000 € (sans frais). Quelle est la plus-value imposable ?\",\"payload\":{\"unit\":\"€\",\"hint\":\"Sans espace ni symbole ; décimale avec un point ou une virgule.\"},\"solution\":{\"value\":750,\"absTol\":0.01},\"explanation\":\"2 000 − 5 000 × 2 000 / 8 000 = 2 000 − 1 250 = 750 €.\",\"hint\":\"**Fiscalité des crypto-actifs** : Plus-values imposées lors des cessions contre euros ou biens ; formule au prorata du portefeuille.\",\"concepts\":[\"fiscalite-crypto\"],\"source\":null},{\"id\":\"18168085b270\",\"moduleSlug\":\"m2-passer-un-ordre\",\"chapterSlug\":\"carnet-spread-liquidite\",\"type\":\"FIGURE_INTERPRET\",\"difficulty\":3,\"points\":4,\"prompt\":\"Cas pratique. Tu as 20 ans, 3 000 € à placer pour au moins 10 ans en actions européennes, et tu veux acheter 300 actions de cette société. Voici son carnet d'ordres.\",\"payload\":{\"figure\":{\"kind\":\"data-table\",\"columns\":[\"Qté achat\",\"Bid (€)\",\"Ask (€)\",\"Qté vente\"],\"rows\":[[150,\"12,40\",\"12,46\",100],[400,\"12,38\",\"12,48\",250],[600,\"12,36\",\"12,50\",800]],\"caption\":\"Carnet d'une valeur moyenne de la cote, éligible au PEA\"},\"subQuestions\":[{\"id\":\"q1\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Quelle enveloppe choisis-tu ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Un PEA, ouvert dès maintenant\"},{\"id\":\"b\",\"label\":\"Une plateforme crypto\"},{\"id\":\"c\",\"label\":\"Un CTO\"}]}},{\"id\":\"q2\",\"type\":\"NUMERIC\",\"prompt\":\"Si tu achètes 300 actions au marché, quel montant total paies-tu, hors frais ?\",\"payload\":{\"unit\":\"€\"}},{\"id\":\"q3\",\"type\":\"NUMERIC\",\"prompt\":\"Quel est le spread, en euros ?\",\"payload\":{\"unit\":\"€\"}},{\"id\":\"q4\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Pour ne pas payer plus de 12,46 € par action, quel ordre passes-tu ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Achat à cours limité à 12,46 €\"},{\"id\":\"b\",\"label\":\"Achat au marché\"},{\"id\":\"c\",\"label\":\"Achat à seuil de déclenchement à 12,46 €\"}]}}]},\"solution\":{\"subSolutions\":[{\"id\":\"q1\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q2\",\"solution\":{\"value\":3742,\"absTol\":0.01}},{\"id\":\"q3\",\"solution\":{\"value\":0.06,\"absTol\":0.001}},{\"id\":\"q4\",\"solution\":{\"correct\":[\"a\"]}}]},\"explanation\":\"Horizon long et actions européennes : le PEA s'impose, et l'ouvrir tôt lance le délai de 5 ans. Au marché, l'ordre prend 100 actions à 12,46 € (1 246 €) puis 200 à 12,48 € (2 496 €), soit 3 742 €. Le spread vaut 12,46 − 12,40 = 0,06 €. Un ordre à cours limité à 12,46 € plafonne le prix, au risque d'une exécution partielle (100 actions seulement disponibles à ce prix).\",\"hint\":\"**PEA** : Plan d'épargne en actions : actions européennes, plafond 150 000 €, avantage fiscal après 5 ans.\",\"concepts\":[\"pea\",\"carnet-ordres\",\"spread\",\"ordre-a-cours-limite\"],\"source\":null}]}]}]\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[68574,[\"/trd/_next/static/chunks/93d6b92b1100dd7f.js\",\"/trd/_next/static/chunks/2571da505c8daa2f.js\"],\"IconMark\"]\nd:null\n11:[[\"$\",\"title\",\"0\",{\"children\":\"trd.app — Apprendre le trading, du niveau zéro au bot\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Plateforme pour apprendre le trading actions/ETF et crypto : marchés, analyse, gestion
