oc. 7 et 8\"},{\"id\":\"271fc61e55db\",\"moduleSlug\":\"m6-violence-prevention\",\"chapterSlug\":\"violence-classique\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Qu'est-ce qui distingue la violence du dol quant à leur auteur ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Aucun des deux ne peut venir d'un tiers\"},{\"id\":\"b\",\"label\":\"Seul le dol d'un tiers est une cause de nullité\"},{\"id\":\"c\",\"label\":\"La violence d'un tiers est une cause de nullité\"},{\"id\":\"d\",\"label\":\"La violence doit venir d'un professionnel\"}]},\"solution\":{\"correct\":[\"c\"]},\"explanation\":\"Article 1142 pour la violence ; le dol, lui, doit venir du cocontractant.\",\"hint\":\"Pense à la gravité de la violence.\",\"concepts\":[\"violence-tiers\"],\"source\":\"CM, Partie I, Titre 2, chap. 1, section 1, §3, I (p. 13) ; TD n° 5, doc. 1, 2 et 7\"},{\"id\":\"958af2f79b26\",\"moduleSlug\":\"m6-violence-prevention\",\"chapterSlug\":\"abus-dependance\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Quel arrêt décide que la contrainte économique se rattache à la violence et non à la lésion ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Civ. 2e, 9 décembre 2021\"},{\"id\":\"b\",\"label\":\"Civ. 1re, 30 mai 2000\"},{\"id\":\"c\",\"label\":\"3e civ., 17 janvier 1984\"},{\"id\":\"d\",\"label\":\"Civ. 1re, 3 mai 2000\"}]},\"solution\":{\"correct\":[\"b\"]},\"explanation\":\"Un assuré attaquait une transaction signée après un incendie.\",\"hint\":\"C'est l'arrêt de l'assuré après un incendie.\",\"concepts\":[\"contrainte-economique\"],\"source\":\"CM, Partie I, Titre 2, chap. 1, section 1, §3, II (p. 13-14) ; TD n° 5, doc. 3 à 6\"},{\"id\":\"efca5cc248a7\",\"moduleSlug\":\"m6-violence-prevention\",\"chapterSlug\":\"information-precontractuelle\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"De quelle nature est le devoir d'information de l'article 1112-1 ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Supplétive\"},{\"id\":\"b\",\"label\":\"D'ordre public\"},{\"id\":\"c\",\"label\":\"Réservée aux professionnels\"},{\"id\":\"d\",\"label\":\"Limitée aux contrats d'adhésion\"}]},\"solution\":{\"correct\":[\"b\"]},\"explanation\":\"Les parties ne peuvent ni le limiter ni l'exclure.\",\"hint\":\"Une clause peut-elle l'écarter ?\",\"concepts\":[\"information-precontractuelle\"],\"source\":\"CM, Partie I, Titre 1, chap. 2, section 1, II (p. 7-8) et Titre 2, chap. 1, section 2, §1 (p. 14)\"},{\"id\":\"8fb3ab574bc1\",\"moduleSlug\":\"m6-violence-prevention\",\"chapterSlug\":\"reflexion-retractation\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Selon le cours, quel délai de rétractation s'applique à un contrat conclu par voie électronique à distance ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"30 jours\"},{\"id\":\"b\",\"label\":\"10 jours\"},{\"id\":\"c\",\"label\":\"14 jours\"},{\"id\":\"d\",\"label\":\"7 jours\"}]},\"solution\":{\"correct\":[\"c\"]},\"explanation\":\"Le cours cite 14 jours pour les contrats électroniques et 10 jours pour un bien immobilier.\",\"hint\":\"Le cours donne un autre délai pour l'immobilier.\",\"concepts\":[\"delai-retractation\"],\"source\":\"CM, Partie I, Titre 2, chap. 1, section 2, §2 (p. 14)\"},{\"id\":\"e66ca386bbdd\",\"moduleSlug\":\"m7-capacite-contenu\",\"chapterSlug\":\"capacite\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Qui doit être représenté pour contracter ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Le salarié\"},{\"id\":\"b\",\"label\":\"L'avocat\"},{\"id\":\"c\",\"label\":\"Le mineur non émancipé\"},{\"id\":\"d\",\"label\":\"Le commerçant\"}]},\"solution\":{\"correct\":[\"c\"]},\"explanation\":\"Il est frappé d'une incapacité d'exercice (art. 1146).\",\"hint\":\"Pense aux incapacités d'exercice.\",\"concepts\":[\"incapacite\"],\"source\":\"CM, Partie I, Titre 2, chap. 2 (p. 15)\"},{\"id\":\"4732c4cb0549\",\"moduleSlug\":\"m7-capacite-contenu\",\"chapterSlug\":\"contenu-licite\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Selon l'article 1162, un but contraire à l'ordre public annule le contrat…\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"seulement s'il est puni pénalement\"},{\"id\":\"b\",\"label\":\"seulement s'il était commun aux deux parties\"},{\"id\":\"c\",\"label\":\"seulement s'il figure dans le contrat\"},{\"id\":\"d\",\"label\":\"qu'il ait été connu ou non de toutes les parties\"}]},\"solution\":{\"correct\":[\"d\"]},\"explanation\":\"La réforme consacre la solution de Civ. 1re, 7 octobre 1998.\",\"hint\":\"L'ignorance d'une partie ne sauve pas le contrat.\",\"concepts\":[\"but-illicite\"],\"source\":\"CM, Partie I, Titre 2, chap. 3, section 1, §1 (p. 15) ; TD n° 6, doc. 1 à 6\"},{\"id\":\"dbb606af1c6b\",\"moduleSlug\":\"m7-capacite-contenu\",\"chapterSlug\":\"equilibre-contrat\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Un contrat de fourniture conclu en 2018 devient ruineux après une hausse imprévisible des matières premières. Quel texte invoquer ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"L'article 1112\"},{\"id\":\"b\",\"label\":\"L'article 1195\"},{\"id\":\"c\",\"label\":\"L'article 1143\"},{\"id\":\"d\",\"label\":\"L'article 1168\"}]},\"solution\":{\"correct\":[\"b\"]},\"explanation\":\"L'imprévision : un déséquilibre apparu pendant l'exécution, pour un contrat postérieur au 1er octobre 2016.\",\"hint\":\"Le déséquilibre apparaît pendant l'exécution.\",\"concepts\":[\"imprevision\"],\"source\":\"CM, Partie I, Titre 2, chap. 3, section 2 (p. 16-17) ; TD n° 2, doc. 6 ; TD n° 6, doc. 7 et 8\"},{\"id\":\"c8c30a03f833\",\"moduleSlug\":\"m7-capacite-contenu\",\"chapterSlug\":\"td-seance-6\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Quelle conception de la cause l'arrêt Com., 9 juin 2009 retient-il ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Une conception fondée sur la rentabilité\"},{\"id\":\"b\",\"label\":\"Une conception objective\"},{\"id\":\"c\",\"label\":\"Une conception subjective\"},{\"id\":\"d\",\"label\":\"Aucune, la cause étant supprimée\"}]},\"solution\":{\"correct\":[\"b\"]},\"explanation\":\"La cause de l'obligation d'une partie réside dans l'obligation de l'autre.\",\"hint\":\"La Cour ne regarde pas les mobiles.\",\"concepts\":[\"contrepartie-illusoire\"],\"source\":\"TD n° 6, doc. 9\"},{\"id\":\"157a511250c3\",\"moduleSlug\":\"m5-erreur-dol\",\"chapterSlug\":\"dol\",\"type\":\"CASE_STUDY\",\"difficulty\":3,\"points\":4,\"prompt\":\"Cas guidé : une cession de parts.\",\"payload\":{\"scenario\":\"Antoine cède à Inès toutes les parts de sa société. Il sait qu'un redressement fiscal menace gravement la société, mais n'en dit rien. Inès, ancienne dirigeante d'entreprise, n'a fait aucune vérification. Elle demande l'annulation de la cession ; Antoine lui oppose qu'elle aurait dû se renseigner.\",\"subQuestions\":[{\"id\":\"q1\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Quel vice Inès peut-elle invoquer ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Une réticence dolosive\"},{\"id\":\"b\",\"label\":\"La lésion\"},{\"id\":\"c\",\"label\":\"La violence économique du cédant\"}]}},{\"id\":\"q2\",\"type\":\"TRUE_FALSE\",\"prompt\":\"Son absence de vérification rend son erreur inexcusable.\",\"payload\":{}},{\"id\":\"q3\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Quel texte rend l'erreur provoquée toujours excusable ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"L'article 1168\"},{\"id\":\"b\",\"label\":\"L'article 1136\"},{\"id\":\"c\",\"label\":\"L'article 1139\"}]}},{\"id\":\"q4\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Quelle sanction peut-elle demander ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"La nullité absolue, ouverte à tout intéressé\"},{\"id\":\"b\",\"label\":\"La nullité relative de la cession\"},{\"id\":\"c\",\"label\":\"La révision du prix par le juge\"}]}}]},\"solution\":{\"subSolutions\":[{\"id\":\"q1\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q2\",\"solution\":{\"value\":false}},{\"id\":\"q3\",\"solution\":{\"correct\":[\"c\"]}},{\"id\":\"q4\",\"solution\":{\"correct\":[\"b\"]}}]},\"explanation\":\"Antoine a dissimulé intentionnellement une information qu'il savait déterminante : c'est une réticence dolosive (art. 1137). L'erreur provoquée par un dol est toujours excusable (art. 1139) : le devoir de se renseigner d'Inès est indifférent (Com., 18 septembre 2024). La sanction est la nullité relative (art. 1131).\",\"hint\":\"Reprends Com., 18 septembre 2024.\",\"concepts\":[\"reticence-dolosive\",\"erreur-provoquee\",\"nullite-relative\"],\"source\":\"CM, Partie I, Titre 2, chap. 1, section 1, §2 (p. 11-13) ; TD n° 4, doc. 7 et 8\"},{\"id\":\"98a0de65dae9\",\"moduleSlug\":\"m7-capacite-contenu\",\"chapterSlug\":\"contenu-certain\",\"type\":\"CASE_STUDY\",\"difficulty\":3,\"points\":4,\"prompt\":\"Cas guidé : un prix fixé par une seule partie.\",\"payload\":{\"scenario\":\"En 2025, une association signe un contrat de maintenance de son matériel de sonorisation. Le contrat prévoit que le prestataire fixera seul, chaque trimestre, le prix de ses interventions. En 2026, il double ce prix sans explication.\",\"subQuestions\":[{\"id\":\"q1\",\"type\":\"TRUE_FALSE\",\"prompt\":\"La clause qui laisse le prestataire fixer seul son prix est nulle par principe.\",\"payload\":{}},{\"id\":\"q2\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Que peut obtenir l'association si le prix est fixé abusivement ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"La nullité du contrat pour lésion, quel que soit le montant\"},{\"id\":\"b\",\"label\":\"Rien, le prix est libre\"},{\"id\":\"c\",\"label\":\"Des dommages-intérêts, voire l'anéantissement du contrat\"}]}},{\"id\":\"q3\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Quand le prestataire doit-il justifier son prix ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"À chaque facture\"},{\"id\":\"b\",\"label\":\"Jamais\"},{\"id\":\"c\",\"label\":\"En cas de contestation\"}]}},{\"id\":\"q4\",\"type\":\"TRUE_FALSE\",\"prompt\":\"Si un changement imprévisible rendait l'exécution excessivement onéreuse, l'association pourrait demander une renégociation.\",\"payload\":{}}]},\"solution\":{\"subSolutions\":[{\"id\":\"q1\",\"solution\":{\"value\":false}},{\"id\":\"q2\",\"solution\":{\"correct\":[\"c\"]}},{\"id\":\"q3\",\"solution\":{\"correct\":[\"c\"]}},{\"id\":\"q4\",\"solution\":{\"value\":true}}]},\"explanation\":\"Dans un contrat de prestation de service, le prix peut être fixé par le créancier (art. 1165) ; il doit le justifier en cas de contestation, et l'abus est sanctionné par des dommages-intérêts et, selon le cours, l'anéantissement du contrat. Conclu en 2025, le contrat relève de l'article 1195 en cas d'imprévision.\",\"hint\":\"Cherche l'article propre aux contrats de prestation de service.\",\"concepts\":[\"prix-unilateral\",\"imprevision\"],\"source\":\"CM, Partie I, Titre 2, chap. 3, section 1, §2 (p. 16)\"}]}]}]\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[68574,[\"/contrats/_next/static/chunks/93d6b92b1100dd7f.js\",\"/contrats/_next/static/chunks/2571da505c8daa2f.js\"],\"IconMark\"]\nd:null\n11:[[\"$\",\"title\",\"0\",{\"children\":\"contrats.app — Réviser le droit des contrats\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Plateforme de révision du droit des contrats (L2, semestre 3) : sources de l'obligation, notion de contrat et réforme de 2016, conclusion du contrat, vices du consentement, capacité et contenu. Parcours linéaire verrouillé, exercices auto-corrigés, cas pratiques et commentaires d'arrêt.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/contrats/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L14\",\"3\",{}]]\n"])</script
