?\",\"concepts\":[\"fiche-arret\"],\"source\":\"Fascicule de méthodologie, p. 18-20\"},{\"id\":\"87b89f538a20\",\"moduleSlug\":\"m2-methodologie\",\"chapterSlug\":\"commentaire-arret\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"À quel stade du commentaire dit-on si un arrêt est de principe ou d'espèce ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"L'accroche\"},{\"id\":\"b\",\"label\":\"L'exposé des faits\"},{\"id\":\"c\",\"label\":\"La portée\"},{\"id\":\"d\",\"label\":\"Le sens\"}]},\"solution\":{\"correct\":[\"c\"]},\"explanation\":\"La portée situe l'arrêt dans le droit positif : c'est là qu'on mesure son importance.\",\"hint\":\"C'est la place de l'arrêt dans le temps.\",\"concepts\":[\"sens-valeur-portee\"],\"source\":\"Fascicule de méthodologie, p. 21-26\"},{\"id\":\"02a6d66468c7\",\"moduleSlug\":\"m3-notion-contrat\",\"chapterSlug\":\"definition-classifications\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Le cautionnement non rémunéré consenti par des parents pour le logement de leur enfant est un contrat…\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"aléatoire\"},{\"id\":\"b\",\"label\":\"réel\"},{\"id\":\"c\",\"label\":\"synallagmatique\"},{\"id\":\"d\",\"label\":\"à titre gratuit\"}]},\"solution\":{\"correct\":[\"d\"]},\"explanation\":\"C'est l'exemple du tableau du TD n° 2 : la caution ne reçoit aucune contrepartie.\",\"hint\":\"La caution reçoit-elle quelque chose ?\",\"concepts\":[\"contrat-onereux\"],\"source\":\"CM, Section 2, §1 et §2 (p. 2-3) ; TD n° 2, doc. 1\"},{\"id\":\"be0a91ebfdc3\",\"moduleSlug\":\"m3-notion-contrat\",\"chapterSlug\":\"principes-directeurs\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Selon l'article 1193, comment un contrat peut-il être modifié ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Par le seul créancier\"},{\"id\":\"b\",\"label\":\"Par consentement mutuel, ou pour les causes que la loi autorise\"},{\"id\":\"c\",\"label\":\"Par la partie la plus diligente\"},{\"id\":\"d\",\"label\":\"Par le juge, dès qu'il estime le contrat déséquilibré au détriment d'une partie\"}]},\"solution\":{\"correct\":[\"b\"]},\"explanation\":\"Conséquence de la force obligatoire : le contrat est intangible, sauf accord des parties ou texte.\",\"hint\":\"C'est une conséquence de l'article 1103.\",\"concepts\":[\"force-obligatoire\"],\"source\":\"CM, Section 2, §3 (p. 3-4) ; TD n° 2, doc. 2\"},{\"id\":\"ff592fabc5d2\",\"moduleSlug\":\"m3-notion-contrat\",\"chapterSlug\":\"application-temps\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Une promesse de vente est signée le 15 septembre 2016. Quel droit la régit ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Le droit issu de la loi de ratification\"},{\"id\":\"b\",\"label\":\"Le droit issu de l'ordonnance\"},{\"id\":\"c\",\"label\":\"Le droit en vigueur le jour de la levée de l'option\"},{\"id\":\"d\",\"label\":\"Le droit antérieur à la réforme\"}]},\"solution\":{\"correct\":[\"d\"]},\"explanation\":\"Elle est conclue avant le 1er octobre 2016 : la loi ancienne s'applique (art. 9 de l'ordonnance).\",\"hint\":\"Compare sa date à l'entrée en vigueur de l'ordonnance.\",\"concepts\":[\"application-temps\"],\"source\":\"TD n° 2, doc. 5 et 6\"},{\"id\":\"66b323168e1a\",\"moduleSlug\":\"m4-conclusion-contrat\",\"chapterSlug\":\"offre\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Laquelle de ces circonstances rend une offre caduque ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"L'incapacité de son auteur\"},{\"id\":\"b\",\"label\":\"L'envoi d'une demande de précisions par le destinataire\"},{\"id\":\"c\",\"label\":\"La rédaction de l'offre sur papier libre\"},{\"id\":\"d\",\"label\":\"Le passage d'une semaine, quel que soit le délai prévu\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"Article 1117 : expiration du délai, incapacité ou décès de l'auteur, décès du destinataire.\",\"hint\":\"Relis l'article 1117.\",\"concepts\":[\"caducite-offre\"],\"source\":\"CM, Partie I, Titre 1, chap. 1, section 1 (p. 4-5) ; TD n° 3, doc. 1 et 2\"},{\"id\":\"b7c7320151e3\",\"moduleSlug\":\"m4-conclusion-contrat\",\"chapterSlug\":\"acceptation\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Que doit faire l'auteur d'une offre en ligne après avoir reçu une commande ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"La faire signer à la main par le client\"},{\"id\":\"b\",\"label\":\"En accuser réception sans délai injustifié\"},{\"id\":\"c\",\"label\":\"Attendre un délai de réflexion de sept jours\"},{\"id\":\"d\",\"label\":\"Envoyer un contrat papier\"}]},\"solution\":{\"correct\":[\"b\"]},\"explanation\":\"Article 1127-2, alinéa 2 : il accuse réception de la commande par voie électronique.\",\"hint\":\"Le client doit savoir que sa commande est arrivée.\",\"concepts\":[\"contrat-electronique\"],\"source\":\"CM, Partie I, Titre 1, chap. 1, section 2 (p. 5-6) ; TD n° 3, doc. 3\"},{\"id\":\"17ca2d4e0f5c\",\"moduleSlug\":\"m4-conclusion-contrat\",\"chapterSlug\":\"pourparlers\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Après une rupture fautive de pourparlers, que peut-on se faire rembourser ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Les frais de négociation\"},{\"id\":\"b\",\"label\":\"La perte de chance de conclure\"},{\"id\":\"c\",\"label\":\"Le bénéfice attendu du contrat\"},{\"id\":\"d\",\"label\":\"La valeur du contrat non conclu\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"Manoukian et article 1112, alinéa 2 : ni les gains espérés, ni la perte de chance de les obtenir.\",\"hint\":\"On rembourse ce qui a été dépensé.\",\"concepts\":[\"prejudice-rupture\"],\"source\":\"CM, Partie I, Titre 1, chap. 2, section 1 (p. 6-8) ; TD n° 3, doc. 4 à 6\"},{\"id\":\"d06ed2b1be9e\",\"moduleSlug\":\"m4-conclusion-contrat\",\"chapterSlug\":\"pacte-preference\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Le bénéficiaire d'un pacte ne répond pas dans le délai fixé par l'action interrogatoire du tiers. Que perd-il ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Le bénéfice du pacte lui-même\"},{\"id\":\"b\",\"label\":\"Rien du tout\"},{\"id\":\"c\",\"label\":\"Son droit à des dommages-intérêts contre le promettant\"},{\"id\":\"d\",\"label\":\"Le droit de demander sa substitution ou la nullité\"}]},\"solution\":{\"correct\":[\"d\"]},\"explanation\":\"Article 1123, alinéa 4 : faute de réponse, il ne peut plus solliciter sa substitution ni la nullité du contrat conclu avec le tiers.\",\"hint\":\"L'action interrogatoire sécurise le contrat conclu avec le tiers.\",\"concepts\":[\"action-interrogatoire\"],\"source\":\"CM, Partie I, Titre 1, chap. 2, section 2 (p. 9) ; TD n° 3, doc. 7\"},{\"id\":\"c43fee3fd3ae\",\"moduleSlug\":\"m4-conclusion-contrat\",\"chapterSlug\":\"promesse-unilaterale\",\"type\":\"CASE_STUDY\",\"difficulty\":3,\"points\":4,\"prompt\":\"Cas guidé : promesse et offre.\",\"payload\":{\"scenario\":\"En 2014, Bernard consent à Chloé une promesse unilatérale de vente d'un terrain, l'option devant être levée avant 2027. En 2019, il lui écrit qu'il se rétracte. Chloé lève l'option en 2025.\\n\\nLe 1er juin 2026, Bernard offre par courriel à Denis de lui vendre son bateau, offre « valable jusqu'au 15 juin ». Denis accepte par un courriel envoyé le 15 juin à 23 h 50, que Bernard reçoit le 16 juin à 0 h 10.\",\"subQuestions\":[{\"id\":\"q1\",\"type\":\"TRUE_FALSE\",\"prompt\":\"La rétractation de 2019 empêche la vente du terrain.\",\"payload\":{}},{\"id\":\"q2\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Sur quel fondement Chloé obtient-elle la vente ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"L'article 1124, alinéa 2, directement applicable\"},{\"id\":\"b\",\"label\":\"L'ancien article 1134, lu selon le revirement de 2021\"},{\"id\":\"c\",\"label\":\"L'article 1195 sur l'imprévision\"}]}},{\"id\":\"q3\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"La vente du bateau est-elle formée ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Oui, l'acceptation a été envoyée dans le délai\"},{\"id\":\"b\",\"label\":\"Oui, un retard de dix minutes est négligeable au regard du délai de quinze jours\"},{\"id\":\"c\",\"label\":\"Non, l'acceptation est reçue après l'expiration de l'offre\"}]}},{\"id\":\"q4\",\"type\":\"TRUE_FALSE\",\"prompt\":\"Bernard aurait pu prévoir que le contrat serait conclu dès l'envoi de l'acceptation.\",\"payload\":{}}]},\"solution\":{\"subSolutions\":[{\"id\":\"q1\",\"solution\":{\"value\":false}},{\"id\":\"q2\",\"solution\":{\"correct\":[\"b\"]}},{\"id\":\"q3\",\"solution\":{\"correct\":[\"c\"]}},{\"id\":\"q4\",\"solution\":{\"value\":true}}]},\"explanation\":\"Terrain : la promesse date de 2014, l'article 1124 ne s'applique pas. Mais depuis le revirement de 2021 (3e civ., 23 juin 2021 ; Com., 15 mars 2023), le promettant ne peut plus se rétracter, et la vente forcée peut être ordonnée (3e civ., 21 novembre 2024).\\n\\nBateau : le contrat est conclu à la réception de l'acceptation (art. 1121) ; reçue après l'expiration du délai, elle ne produit aucun effet (Civ. 1re, 6 janvier 2021). La règle étant supplétive, Bernard pouvait retenir l'émission.\",\"hint\":\"Date de la promesse, puis date de réception de l'acceptation.\",\"concepts\":[\"revirement-promesse\",\"theorie-reception\"],\"source\":\"CM, Partie I, Titre 1, chap. 2, section 2 (p. 8) ; TD n° 3, doc. 7 à 9 ; TD n° 7\"},{\"id\":\"adf964121f77\",\"moduleSlug\":\"m1-sources-obligation\",\"chapterSlug\":\"loteries-publicitaires\",\"type\":\"CASE_STUDY\",\"difficulty\":3,\"points\":4,\"prompt\":\"Cas guidé : une annonce de gain.\",\"payload\":{\"scenario\":\"Mme R. reçoit une lettre à son nom : « Madame R., vous avez gagné 10 000 euros ! » Au verso, en petits caractères, un règlement indique qu'un tirage au sort désignera le gagnant parmi les participants. Elle réclame les 10 000 euros.\",\"subQuestions\":[{\"id\":\"q1\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Sur quel fondement Mme R. peut-elle obtenir les 10 000 euros ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"La responsabilité délictuelle\"},{\"id\":\"b\",\"label\":\"Le quasi-contrat\"},{\"id\":\"c\",\"label\":\"Le contrat\"}]}},{\"id\":\"q2\",\"type\":\"TRUE_FALSE\",\"prompt\":\"Le règlement au verso suffit à écarter l'obligation de l'organisateur.\",\"payload\":{}},{\"id\":\"q3\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Que doit-elle établir ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Une annonce à son nom, sans aléa visible à première lecture\"},{\"id\":\"b\",\"label\":\"Une faute de l'organisateur, un préjudice et un lien de causalité\"},{\"id\":\"c\",\"label\":\"Une commande passée auprès de la société\"}]}},{\"id\":\"q4\",\"type\":\"TRUE_FALSE\",\"prompt\":\"Sur le terrain de la responsabilité délictuelle, elle obtiendrait en principe la même somme.\",\"payload\":{}}]},\"solution\":{\"subSolutions\":[{\"id\":\"q1\",\"solution\":{\"correct\":[\"b\"]}},{\"id\":\"q2\",\"solution\":{\"value\":false}},{\"id\":\"q3\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q4\",\"solution\":{\"value\":false}}]},\"explanation\":\"Depuis la Chambre mixte du 6 septembre 2002, l'organisateur qui annonce un gain à une personne dénommée sans mettre en évidence l'aléa s'oblige, par ce fait purement volontaire, à le délivrer. L'aléa doit apparaître à première lecture (Civ. 1re, 10 juillet 2013) : un règlement en petits caractères au verso ne suffit pas. La responsabilité délictuelle ne répare que le préjudice subi, souvent bien inférieur au gain.\",\"hint\":\"Reprends l'attendu de la Chambre mixte.\",\"concepts\":[\"annonce-gain\",\"quasi-contrat\"],\"source\":\"TD n° 1, doc. 2 à 7\"}]}]}]\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[68574,[\"/contr
