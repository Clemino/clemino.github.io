"Cours, introduction (p. 1-3)\"},{\"id\":\"c0106c17a167\",\"moduleSlug\":\"m1-introduction\",\"chapterSlug\":\"histoire-finances\",\"type\":\"TRUE_FALSE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Le principe d'annualité du budget s'impose sous la Restauration.\",\"payload\":{},\"solution\":{\"value\":true},\"explanation\":\"Sous la Restauration s'imposent l'annualité, la comptabilité publique et la non-affectation des recettes.\",\"hint\":\"Après la Révolution et l'Empire.\",\"concepts\":[\"annualite-budgetaire\"],\"source\":\"Cours, introduction, II, C (p. 6-8)\"},{\"id\":\"5e5eea2e57df\",\"moduleSlug\":\"m2-liberal-interventionniste\",\"chapterSlug\":\"etat-providence\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Quel président américain lance le New Deal ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Franklin D. Roosevelt\"},{\"id\":\"b\",\"label\":\"Herbert Hoover\"},{\"id\":\"c\",\"label\":\"Woodrow Wilson\"},{\"id\":\"d\",\"label\":\"Theodore Roosevelt, président au début du siècle\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"Élu en 1932, Franklin D. Roosevelt lance le New Deal pour répondre à la crise de 1929.\",\"hint\":\"Le président élu en pleine crise, en 1932.\",\"concepts\":[\"new-deal\"],\"source\":\"Cours, titre I, chapitre 2, section 1, I et II (p. 11-12)\"},{\"id\":\"15c2fee3ab62\",\"moduleSlug\":\"m3-finances-modernes\",\"chapterSlug\":\"principes-budgetaires\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"D'où vient le principe de sincérité budgétaire ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"De la jurisprudence du Conseil constitutionnel, consacrée par la LOLF\"},{\"id\":\"b\",\"label\":\"D'un article de la Déclaration des droits de l'homme et du citoyen de 1789\"},{\"id\":\"c\",\"label\":\"Du décret du 31 mai 1862 portant règlement de la comptabilité publique\"},{\"id\":\"d\",\"label\":\"Du traité de Maastricht et de ses critères de convergence\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"La sincérité est issue de la jurisprudence du Conseil constitutionnel (décision du 29 décembre 1994), puis inscrite dans la LOLF du 1er août 2001.\",\"hint\":\"Un principe récent, d'abord dégagé par un juge.\",\"concepts\":[\"sincerite-budgetaire\"],\"source\":\"Cours, titre I, chapitre 2, section 3, II (p. 19)\"},{\"id\":\"e9bd52619db0\",\"moduleSlug\":\"m4-economie-marche\",\"chapterSlug\":\"privatisations-liberalisation\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Quel organisme gère les participations de l'État depuis 2004 ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"L'Agence des participations de l'État\"},{\"id\":\"b\",\"label\":\"L'Agence France Trésor\"},{\"id\":\"c\",\"label\":\"La Caisse des dépôts et consignations\"},{\"id\":\"d\",\"label\":\"La Direction générale des finances publiques\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"L'Agence des participations de l'État (APE), créée en 2004, gère les participations de l'État ; l'Agence France Trésor gère la dette et la trésorerie.\",\"hint\":\"Son nom dit ce qu'elle gère.\",\"concepts\":[\"ape\"],\"source\":\"Cours, titre I, chapitre 3, section 1, I (p. 21-24)\"},{\"id\":\"46c204345801\",\"moduleSlug\":\"m5-deficits-excessifs\",\"chapterSlug\":\"regles-europeennes\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Quand la clause dérogatoire générale du Pacte de stabilité est-elle activée ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"En mars 2020\"},{\"id\":\"b\",\"label\":\"Lors de la crise bancaire de 2008\"},{\"id\":\"c\",\"label\":\"À la signature du TSCG en 2012\"},{\"id\":\"d\",\"label\":\"Avec les nouvelles règles de 2024\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"La clause dérogatoire générale est activée en mars 2020, face à la crise sanitaire ; les nouvelles règles approuvées en 2024 s'appliquent depuis 2025.\",\"hint\":\"Face à la crise sanitaire.\",\"concepts\":[\"clause-derogatoire\"],\"source\":\"Cours, titre I, chapitre 3, section 2 (p. 28-33)\"},{\"id\":\"d5775f6a8310\",\"moduleSlug\":\"m5-deficits-excessifs\",\"chapterSlug\":\"regles-nationales-notation\",\"type\":\"TRUE_FALSE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Le Haut Conseil des finances publiques rend un avis sur le projet de loi de finances.\",\"payload\":{},\"solution\":{\"value\":true},\"explanation\":\"Créé par la loi organique du 17 décembre 2012 et présidé par le premier président de la Cour des comptes, le HCFP rend chaque année un avis sur la faisabilité du projet de loi de finances.\",\"hint\":\"Un organe indépendant créé en 2012.\",\"concepts\":[\"hcfp\"],\"source\":\"Cours, titre I, chapitre 3, section 2 (p. 33-35)\"},{\"id\":\"2868105bfff2\",\"moduleSlug\":\"m6-lolf\",\"chapterSlug\":\"lolf-efficacite\",\"type\":\"MCQ_SINGLE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Combien de missions compte à peu près le budget de l'État depuis la LOLF ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Une trentaine\"},{\"id\":\"b\",\"label\":\"Environ 130 à 140\"},{\"id\":\"c\",\"label\":\"848\"},{\"id\":\"d\",\"label\":\"Une dizaine\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"Le budget compte une trentaine de missions, divisées en 130 à 140 programmes ; les 848 chapitres sont ceux de l'ordonnance de 1959.\",\"hint\":\"Moins que les programmes, qui les déclinent.\",\"concepts\":[\"missions-programmes\"],\"source\":\"Cours, titre I, chapitre 4, section 1, I, B, 1 (p. 40-41)\"},{\"id\":\"b4834ad44e48\",\"moduleSlug\":\"m6-lolf\",\"chapterSlug\":\"lolf-transparence\",\"type\":\"TRUE_FALSE\",\"difficulty\":1,\"points\":1,\"prompt\":\"Depuis la LOLF, le Parlement peut créer un programme lors du vote du budget.\",\"payload\":{},\"solution\":{\"value\":true},\"explanation\":\"La LOLF permet au Parlement de créer un programme et de modifier la répartition des crédits entre les programmes d'une même mission.\",\"hint\":\"La LOLF élargit le droit d'amendement.\",\"concepts\":[\"pouvoirs-parlement\"],\"source\":\"Cours, titre I, chapitre 4, section 1, II (p. 42-44)\"},{\"id\":\"085ef3738427\",\"moduleSlug\":\"m7-structures-budgetaires\",\"chapterSlug\":\"documents-budgetaires\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Depuis quand le gouvernement recourt-il à la loi de finances spéciale, selon le cours ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Depuis décembre 2024\"},{\"id\":\"b\",\"label\":\"Depuis l'adoption de la LOLF en 2001, chaque année\"},{\"id\":\"c\",\"label\":\"Depuis l'ordonnance de 1959, à chaque alternance\"},{\"id\":\"d\",\"label\":\"Depuis la réforme de 2021, chaque automne\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"Longtemps méconnue, la loi de finances spéciale est utilisée depuis décembre 2024, faute d'adoption à temps de la loi de finances.\",\"hint\":\"Un recours récent, rare jusque-là.\",\"concepts\":[\"loi-finances-speciale\"],\"source\":\"Cours, titre I (finances de l'État), chapitre 1, section 1, II, D (p. 50-51)\"},{\"id\":\"7eea2ebb8172\",\"moduleSlug\":\"m7-structures-budgetaires\",\"chapterSlug\":\"budget-general\",\"type\":\"MCQ_SINGLE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Quelle est la principale dépense fiscale, selon le cours ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Le crédit d'impôt recherche\"},{\"id\":\"b\",\"label\":\"La prime d'activité\"},{\"id\":\"c\",\"label\":\"Le fonds de compensation pour la TVA\"},{\"id\":\"d\",\"label\":\"La dotation globale de fonctionnement\"}]},\"solution\":{\"correct\":[\"a\"]},\"explanation\":\"La principale niche fiscale est le crédit d'impôt recherche ; les dépenses fiscales coûtent 85 milliards d'euros en 2025.\",\"hint\":\"Une niche qui soutient l'innovation des entreprises.\",\"concepts\":[\"depenses-fiscales\"],\"source\":\"Cours, titre I (finances de l'État), chapitre 1, section 2, I, A (p. 55)\"},{\"id\":\"e8e39c86e8ce\",\"moduleSlug\":\"m8-etat-collectivites\",\"chapterSlug\":\"transferts-etat\",\"type\":\"TRUE_FALSE\",\"difficulty\":2,\"points\":1,\"prompt\":\"Les droits de mutation à titre onéreux sont la première ressource fiscale des régions.\",\"payload\":{},\"solution\":{\"value\":false},\"explanation\":\"Les DMTO (11,2 milliards d'euros en 2024) sont la première ressource fiscale des départements ; les régions reçoivent surtout une fraction de TVA.\",\"hint\":\"Pense à la collectivité qui perçoit les frais de notaire.\",\"concepts\":[\"fiscalite-transferee\"],\"source\":\"Cours, titre I (finances de l'État), chapitre 2, section 1, I, B, 3 (p. 64)\"},{\"id\":\"0c704b04263e\",\"moduleSlug\":\"m7-structures-budgetaires\",\"chapterSlug\":\"annexes-comptes-speciaux\",\"type\":\"CASE_STUDY\",\"difficulty\":3,\"points\":4,\"prompt\":\"Cas guidé : lire la loi de finances pour 2025.\",\"payload\":{\"scenario\":\"Un étudiant lit la loi de finances pour 2025. Il relève : une TVA de 101 milliards d'euros, un impôt sur le revenu d'un peu plus de 94 milliards, 85 milliards de dépenses fiscales, un compte de 71 milliards pour les pensions des fonctionnaires et un budget de 2,6 milliards pour le contrôle aérien, financé par des redevances.\",\"subQuestions\":[{\"id\":\"q1\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Quel impôt est la première ressource de l'État ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"La TVA\"},{\"id\":\"b\",\"label\":\"L'impôt sur le revenu\"},{\"id\":\"c\",\"label\":\"L'impôt sur les sociétés\"}]}},{\"id\":\"q2\",\"type\":\"TRUE_FALSE\",\"prompt\":\"Les 85 milliards de dépenses fiscales sont des recettes supplémentaires pour l'État.\",\"payload\":{}},{\"id\":\"q3\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Dans quelle catégorie entre le compte des pensions ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Un compte d'affectation spéciale\"},{\"id\":\"b\",\"label\":\"Un budget annexe, comme le contrôle aérien\"},{\"id\":\"c\",\"label\":\"Un compte de commerce à découvert autorisé\"}]}},{\"id\":\"q4\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Le budget du contrôle aérien peut-il emprunter ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Oui, comme tout budget annexe\"},{\"id\":\"b\",\"label\":\"Non, l'emprunt est réservé au budget général\"},{\"id\":\"c\",\"label\":\"Seulement avec l'accord de la Cour des comptes\"}]}}]},\"solution\":{\"subSolutions\":[{\"id\":\"q1\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q2\",\"solution\":{\"value\":false}},{\"id\":\"q3\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q4\",\"solution\":{\"correct\":[\"a\"]}}]},\"explanation\":\"Q1 : la TVA (101 milliards) devance l'impôt sur le revenu. Q2 : les dépenses fiscales sont des pertes de recettes, traitées comme des charges. Q3 : le CAS Pensions est le plus important compte d'affectation spéciale. Q4 : les budgets annexes peuvent emprunter quand leurs recettes ne couvrent pas leurs dépenses.\",\"hint\":\"Reprends les recettes du budget général, puis la distinction entre budgets annexes et comptes spéciaux.\",\"concepts\":[\"tva\",\"depenses-fiscales\",\"comptes-speciaux\",\"budgets-annexes\"],\"source\":\"Cours, titre I (finances de l'État), chapitre 1, section 2 (p. 52-59)\"},{\"id\":\"faa127f39b53\",\"moduleSlug\":\"m8-etat-collectivites\",\"chapterSlug\":\"debats-dotations\",\"type\":\"CASE_STUDY\",\"difficulty\":3,\"points\":4,\"prompt\":\"Cas guidé : un département en difficulté.\",\"payload\":{\"scenario\":\"Un département dont la population est marquée par la précarité et le chômage voit ses droits de mutation chuter avec la crise de l'immobilier. Son président veut créer une nouvelle taxe départementale pour compenser, et rappelle que son département a perdu la taxe foncière sur les propriétés bâties.\",\"subQuestions\":[{\"id\":\"q1\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Le conseil départemental peut-il créer cette taxe ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Non, seule la loi peut créer un impôt\"},{\"id\":\"b\",\"label\":\"Oui, au nom de la libre administration\"},{\"id\":\"c\",\"label\":\"Oui, si le conseil départemental la vote à l'unanimité\"}]}},{\"id\":\"q2\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"Qu'a reçu le département à la place de la taxe foncière ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Une part de TVA\"},{\"id\":\"b\",\"label\":\"Une hausse de la DGF de 11 milliards d'euros\"},{\"id\":\"c\",\"label\":\"Le produit de la taxe d'habitation des résidences principales\"}]}},{\"id\":\"q3\",\"type\":\"TRUE_FALSE\",\"prompt\":\"La péréquation vise à aider des collectivités défavorisées comme ce département.\",\"payload\":{}},{\"id\":\"q4\",\"type\":\"MCQ_SINGLE\",\"prompt\":\"En 2020, comment l'État a-t-il soutenu les départements face à la chute des DMTO ?\",\"payload\":{\"options\":[{\"id\":\"a\",\"label\":\"Par 2,7 milliards d'euros d'avances\"},{\"id\":\"b\",\"label\":\"Par un relèvement de leurs plafonds d'endettement\"},{\"id\":\"c\",\"label\":\"Par la suppression de leurs dépenses sociales obligatoires\"}]}}]},\"solution\":{\"subSolutions\":[{\"id\":\"q1\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q2\",\"solution\":{\"correct\":[\"a\"]}},{\"id\":\"q3\",\"solution\":{\"value\":true}},{\"id\":\"q4\",\"solution\":{\"correct\":[\"a\"]}}]},\"explanation\":\"Q1 : selon l'article 34 de la Constitution, seule la loi crée l'impôt ; le pouvoir fiscal des collectivités est limité, sans autonomie fiscale. Q2 : après la suppression de la taxe d'habitation, le bloc communal a reçu la taxe foncière bâtie, et les départements une part de TVA. Q3 : la péréquation redistribue des collectivités riches, comme Puteaux, vers les défavorisées, comme la Seine-Saint-Denis. Q4 : la troisième loi de finances rectificative pour 2020 accorde 2,7 milliards d'avances aux départements.\",\"hint\":\"Reprends l'article 72-2, puis le plan de soutien de 2020.\",\"concepts\":[\"autonomie-financiere-locale\",\"perequation\",\"compensations-fiscales\",\"plan-soutien-2020\"],\"source\":\"Cours, titre I (finances de l'État), chapitre 2, section 1 (p. 60-66)\"}]}]}]\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"15:I[68574,[\"/finances/_next/static/chunks/93d6b92b1100dd7f.js\",\"/finances/_next/static/chunks/2571da505c8daa2f.js\"],\"IconMark\"]\ne:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"Finances publiques — Réviser le cours\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Plateforme de révision du cours de finances publiques : finances des administrations publiques, histoire des principes budgétaires, de l'État gendarme à l'État providence, cadre européen et lutte contre les déficits excessifs, LOLF, budget de l'État et relations avec les collectivités territoriales. Parcours linéaire verrouillé, exercices auto-corrigés et dissertations.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/finances/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L15\",\"3\",{}]]\n"])</script></body></html>
