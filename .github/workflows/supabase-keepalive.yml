# The free Supabase project pauses after a week without activity, which breaks sign-in and progress sync.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run a database query
        # The publishable key is public by design; keepalive() only returns 1.
        run: >
          curl --fail-with-body --silent --show-error -X POST
          "https://fcxrvoloiuicbgbqjoco.supabase.co/rest/v1/rpc/keepalive"
          -H "apikey: sb_publishable_c9upHMOOf7Zi_m1xpy_seQ_t3uLZVTG"
          -H "Content-Type: application/json" -d '{}'
