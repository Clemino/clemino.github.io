# Publishes site/ on https://clemino.github.io at each push to main.
name: Deploy site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# One deployment at a time; a running one is never cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only site/ is published: a course generated anywhere else would silently go missing.
      - name: Check that every course is in site/
        run: |
          stray=$(find . -mindepth 2 -maxdepth 2 -type d -name _next -not -path './site/*' -printf '%h\n')
          if [ -n "$stray" ]; then
            echo "::error::Cours généré hors de site/ : $stray. Le déplacer dans site/ (pnpm publish:course doit écrire dans site/<id>/)."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # GitHub can list a freshly uploaded archive a few seconds late, and deploy-pages
      # then fails with "No artifacts named github-pages were found".
      - name: Wait until the site archive is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "::error::L'archive github-pages n'apparaît toujours pas après 2 minutes."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
